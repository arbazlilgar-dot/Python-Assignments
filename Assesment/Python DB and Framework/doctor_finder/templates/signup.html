{% extends 'base.html' %}

{% block content %}
<div class="form-container glass">
    <h2 style="text-align: center; margin-bottom: 2rem;">Patient Registration</h2>
    <form id="signupForm" action="{% url 'signup' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
            <div id="nameErr" class="error-msg"></div>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
            <div id="emailErr" class="error-msg"></div>
        </div>
        <div style="display: flex; gap: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label>Age</label>
                <input type="number" id="age" name="age" class="form-control" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Gender</label>
                <select id="gender" name="gender" class="form-control" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="phone" name="phone" class="form-control" required>
            <div id="phoneErr" class="error-msg"></div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
            <div id="passErr" class="error-msg"></div>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
            <div id="confirmErr" class="error-msg"></div>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Sign Up</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
        <p>Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        
        <!-- Social Auth placeholder -->
        <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <p style="margin-bottom: 1rem; color: var(--text-muted);">Or sign up with</p>
            <button class="btn-outline" style="width: 100%; margin-bottom: 0.5rem;"><i class="fa-brands fa-google"></i> Google</button>
            <button class="btn-outline" style="width: 100%;"><i class="fa-brands fa-facebook"></i> Facebook</button>
        </div>
    </div>
</div>
{% endblock %}
