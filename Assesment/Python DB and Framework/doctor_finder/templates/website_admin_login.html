{% extends 'base.html' %}

{% block title %}Website Admin Login - Doctor Finder{% endblock %}

{% block content %}
<div class="form-container glass">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Website Admin Portal</h2>
        <p style="color: var(--text-muted); margin-top: 0.5rem;"><i class="fa-solid fa-user-shield"></i> Authorized Personnel Only</p>
    </div>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="{% url 'website_admin_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Admin Email</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="admin@domain.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;"><i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
        <a href="{% url 'home' %}" style="color: var(--text-muted); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to main site</a>
    </div>
</div>
{% endblock %}
