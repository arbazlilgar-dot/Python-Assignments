{% extends 'base.html' %}

{% block content %}
<div class="form-container glass">
    <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
    <form action="{% url 'login' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Email (Username)</label>
            <input type="email" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
        <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
        
        <!-- Social Auth placeholder -->
        <div style="margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem;">
            <p style="margin-bottom: 1rem; color: var(--text-muted);">Or login with</p>
            <button class="btn-outline" style="width: 100%; margin-bottom: 0.5rem;"><i class="fa-brands fa-google"></i> Google</button>
            <button class="btn-outline" style="width: 100%;"><i class="fa-brands fa-facebook"></i> Facebook</button>
        </div>
    </div>
</div>
{% endblock %}
