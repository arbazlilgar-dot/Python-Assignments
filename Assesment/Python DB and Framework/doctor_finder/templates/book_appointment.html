{% extends 'base.html' %}

{% block content %}
<div class="form-container glass" style="text-align: center;">
    <h2>Book Appointment</h2>
    <p style="margin-top: 1rem;"><strong>Doctor:</strong> Dr. {{ doctor.name }}</p>
    <p><strong>Specialization:</strong> {{ doctor.specialization }}</p>
    <p><strong>Fee:</strong> <i class="fa-solid fa-indian-rupee-sign"></i> {{ doctor.consultation_fee }}</p>
    
    <form action="{% url 'book_appointment' doctor.id %}" method="POST" style="margin-top: 2rem;">
        {% csrf_token %}
        <div class="form-group" style="text-align: left;">
            <label>Select Date</label>
            <input type="date" name="date" class="form-control" required>
        </div>
        <div class="form-group" style="text-align: left;">
            <label>Select Time</label>
            <input type="time" name="time" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Confirm Date & Time</button>
    </form>
</div>
{% endblock %}
